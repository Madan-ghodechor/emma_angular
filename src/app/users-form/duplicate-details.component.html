<div>
    <h3 mat-dialog-title>Duplicate Details Found In System</h3>

    <mat-dialog-content>
        <table class="user-table">
            <thead>
                <tr>
                    <th>Email</th>
                    <th>Phone</th>
                </tr>
            </thead>

            <tbody>
                @for (item of data; track $index) {
                <tr>
                    <td>{{ item?.email }}</td>
                    <td>{{ item?.phone }}</td>
                </tr>
                }
            </tbody>
        </table>

    </mat-dialog-content>

    <mat-dialog-actions align="end">
        <button mat-button (click)="close()">Close</button>
    </mat-dialog-actions>
</div>
